name: Compilar Ejecutable Windows (.exe)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Compilar AsignadorSIIUPP.exe
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar con PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "AsignadorSIIUPP" `
            --collect-all selenium `
            app.py

      - name: Subir ejecutable como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AsignadorSIIUPP-Windows
          path: dist/AsignadorSIIUPP.exe
          retention-days: 30

      - name: Publicar Release en GitHub (si se crea una etiqueta/tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AsignadorSIIUPP.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

